<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopCart - Products</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        <a href="index.html">Shop<span>Cart</span></a>
    </div>

    <nav class="navbar">

        <a href="index.html">Home</a>
        <a href="products.html?category=Men">Men</a>
        <a href="products.html?category=Women">Women</a>
        <a href="products.html?category=Kids">Kids</a>
        <a href="products.html?category=New">New Arrivals</a>
        <a href="products.html?category=Sale">Sale</a>

    </nav>

    <div class="header-actions">

        <div class="search-box">

            <input
                type="text"
                id="headerSearch"
                placeholder="Search products..."
            >

            <button onclick="searchProducts()">🔍</button>

        </div>

        <a href="login.html" class="header-icon">👤</a>

        <a href="wishlist.html" class="header-icon">
            ❤️
            <span id="wishlistCount" class="count">0</span>
        </a>

        <a href="cart.html" class="header-icon">
            🛒
            <span id="cartCount" class="count">0</span>
        </a>

    </div>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

</header>


<section class="page-header">

    <h1>Shop Collection</h1>

    <p>
        Discover our latest fashion collection
    </p>

</section>


<main class="shop-container">

    <!-- FILTER -->

    <aside class="filters">

        <h3>Filters</h3>

        <div class="filter-group">

            <h4>Category</h4>

            <label>
                <input
                    type="radio"
                    name="category"
                    value="All"
                    checked
                    onchange="applyFilters()"
                >
                All
            </label>

            <label>
                <input
                    type="radio"
                    name="category"
                    value="Men"
                    onchange="applyFilters()"
                >
                Men
            </label>

            <label>
                <input
                    type="radio"
                    name="category"
                    value="Women"
                    onchange="applyFilters()"
                >
                Women
            </label>

            <label>
                <input
                    type="radio"
                    name="category"
                    value="Kids"
                    onchange="applyFilters()"
                >
                Kids
            </label>

        </div>


        <div class="filter-group">

            <h4>Price</h4>

            <label>
                <input
                    type="radio"
                    name="price"
                    value="all"
                    checked
                    onchange="applyFilters()"
                >
                All
            </label>

            <label>
                <input
                    type="radio"
                    name="price"
                    value="1000"
                    onchange="applyFilters()"
                >
                Under ₹1,000
            </label>

            <label>
                <input
                    type="radio"
                    name="price"
                    value="2000"
                    onchange="applyFilters()"
                >
                Under ₹2,000
            </label>

        </div>

    </aside>


    <!-- PRODUCTS -->

    <section class="products-section">

        <div class="products-top">

            <p id="productCount">
                Products
            </p>

            <select
                id="sortProducts"
                onchange="applyFilters()"
            >

                <option value="default">
                    Sort By
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="rating">
                    Rating
                </option>

            </select>

        </div>


        <div
            id="productsContainer"
            class="product-grid"
        ></div>

    </section>

</main>


<footer>

    <div class="footer-container">

        <div class="footer-column">

            <h2 class="footer-logo">
                Shop<span>Cart</span>
            </h2>

            <p>
                Your destination for modern fashion.
            </p>

        </div>

        <div class="footer-column">

            <h3>Shop</h3>

            <a href="products.html?category=Men">Men</a>
            <a href="products.html?category=Women">Women</a>
            <a href="products.html?category=Kids">Kids</a>

        </div>

        <div class="footer-column">

            <h3>Help</h3>

            <a href="#">Contact</a>
            <a href="#">Returns</a>
            <a href="#">Shipping</a>

        </div>

    </div>

    <div class="copyright">
        © 2026 ShopCart
    </div>

</footer>


<script src="./products.js"></script>
<script src="./app.js"></script>

</body>
</html>
