<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopCart - Cart</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header class="header">

    <div class="logo">
        <a href="index.html">
            Shop<span>Cart</span>
        </a>
    </div>

    <nav class="navbar">

        <a href="index.html">Home</a>
        <a href="products.html?category=Men">Men</a>
        <a href="products.html?category=Women">Women</a>
        <a href="products.html?category=Kids">Kids</a>

    </nav>

    <div class="header-actions">

        <a href="wishlist.html" class="header-icon">
            ❤️
            <span id="wishlistCount" class="count">0</span>
        </a>

        <a href="cart.html" class="header-icon">
            🛒
            <span id="cartCount" class="count">0</span>
        </a>

    </div>

</header>


<section class="page-header">

    <h1>Your Shopping Cart</h1>

</section>


<main class="cart-container">

    <section>

        <div id="cartItems"></div>

    </section>


    <aside class="cart-summary">

        <h2>Order Summary</h2>

        <div class="summary-row">

            <span>Subtotal</span>

            <strong id="cartSubtotal">
                ₹0
            </strong>

        </div>

        <div class="summary-row">

            <span>Delivery</span>

            <strong id="delivery">
                ₹0
            </strong>

        </div>

        <hr>

        <div class="summary-total">

            <span>Total</span>

            <strong id="cartTotal">
                ₹0
            </strong>

        </div>

        <a
            href="checkout.html"
            class="btn checkout-btn"
        >
            Proceed to Checkout
        </a>

    </aside>

</main>


<script src="js/products.js"></script>
<script src="js/app.js"></script>

</body>
</html>
